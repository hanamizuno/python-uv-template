# syntax=docker/sandbox-kit:3
#
# Shared mixin kit for Docker Sandboxes (sbx), kit spec v3.
# Background and mechanics live in the runbook,
# ../../docs/knowledge/runbooks/agent-sandbox-sbx.md ("the runbook" below).
#
# Do not pass this kit by hand — the environment files next to it reference it
# and also replace the built-in YOLO launch commands (a mixin cannot change the
# workload's launch command, and v3 has no fork/`extends`). From the
# repository's checkout directory on the host:
#   sbx env run ./.sandbox/claude-auto
#   sbx env run ./.sandbox/codex-approve
# See the runbook's "Overriding the built-in YOLO launch commands".
#
# There is deliberately no per-agent kit: agent-specific setup (the Codex
# config seed, the Codex plugin registration for Claude Code) is guarded so it
# stays harmless in a sandbox built from a different agent kit — the config is
# never read, the registration is skipped. The claude sandbox also gets the
# Codex CLI so Claude Code can orchestrate delegated runs
# (see the runbook's "Orchestration (delegating to Codex)").
#
# Descriptor-only mixin (no Dockerfile / RUN): the local directory can be
# given to an environment file as is, and setup runs once, at sandbox
# creation, as lifecycle install hooks.
#
# Spec: https://github.com/docker/sandbox-kit-spec/blob/main/docs/spec/SPEC-v3.md
# Host verification steps and known-unverified items live in
# ../../docs/knowledge/research/sbx-verification.md.
schemaVersion: "3"
kind: mixin
displayName: python-uv agent env
description: Python 3.14 + uv + prek + Codex CLI agent execution environment

capabilities:
  # --- Network -----------------------------------------------------------------
  # Additional allowances on top of the deny-by-default policy (what this
  # repository's work needs). v3 splits the allowlist by phase: `install` is
  # open only while the install hooks below run and is closed before the agent
  # starts; `runtime` applies to the agent session. This *adds* to the default
  # policy — it does not trim the default's broad wildcards. Inspecting and
  # narrowing the effective policy is a host-side operation
  # (see the runbook's "Task secrets and the network policy").
  - type: com.docker.sandbox/network-policy@1
    config:
      # Only what the install hooks (lifecycle below) fetch from
      install:
        allow:
          # apt / NodeSource (Node for the Codex CLI, when the image lacks it)
          - deb.debian.org
          - security.debian.org
          - deb.nodesource.com
          # uv itself and its managed CPython builds (python-build-standalone
          # is served from GitHub release assets)
          - astral.sh
          - github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          # prek (uv tool install)
          - pypi.org
          - files.pythonhosted.org
          # Codex CLI
          - registry.npmjs.org
          # Claude Code plugin marketplace (openai/codex-plugin-cc)
          - api.anthropic.com
          - api.github.com
          - codeload.github.com
          - raw.githubusercontent.com
      runtime:
        allow:
          # apt
          - deb.debian.org
          - security.debian.org
          # uv itself and its managed CPython builds
          - astral.sh
          - github.com
          - codeload.github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - raw.githubusercontent.com
          # Python packages
          - pypi.org
          - files.pythonhosted.org
          # npm
          - registry.npmjs.org
          # Claude Code
          - api.anthropic.com
          - statsig.anthropic.com
          # Destinations needed if an interactive login (OAuth) becomes
          # necessary inside the VM. The default policy denies these.
          - console.anthropic.com
          - claude.ai
          # Codex
          - api.openai.com
          - auth.openai.com
          - chatgpt.com
          # GitHub API
          - api.github.com

  # --- Credentials ---------------------------------------------------------------
  # A fine-grained PAT registered on the host with
  # `sbx secret set github --sandbox <sandbox name>` is injected as a header by
  # the proxy, for GitHub-bound requests only (the service name matches the
  # registration name). Register it scoped to the sandbox — never globally
  # (-g), which would leak into sandboxes for other repositories. GH_TOKEN
  # inside the VM holds a sentinel value; the real value is only ever spliced
  # into the header by the proxy just before the request leaves — it never
  # enters the VM. PAT scoping follows .devcontainer/README.md
  # "Restricting GitHub permissions (PAT)". Every inject domain must also be
  # in the runtime allowlist above. Optional: the sandbox is created without
  # it, just without GitHub authentication.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: GitHub push / API calls (fine-grained PAT)
    config:
      service: github
      phase: runtime
      apiKey:
        name: GH_TOKEN
        proxyManaged: true
        inject:
          - domain: api.github.com
            header: Authorization
            format: "token %s"
          - domain: github.com
            header: Authorization
            format: "token %s"
  # Template for a task API key. To use it, uncomment, add api.example.com to
  # the runtime allowlist, then recreate the sandbox (`sbx env rm` + run) and
  # only then run `sbx secret set example --sandbox <sandbox name>` on the
  # host — a secret registered before the recreate is dropped along with the
  # old sandbox.
  # - type: com.docker.sandbox/credential@1
  #   optional: true
  #   config:
  #     service: example
  #     phase: runtime
  #     apiKey:
  #       name: EXAMPLE_API_KEY
  #       proxyManaged: true
  #       inject:
  #         - domain: api.example.com
  #           header: Authorization
  #           format: "Bearer %s"

  # --- Setup ---------------------------------------------------------------------
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Install hooks run once, at sandbox creation (recreate to re-run).
        # They run as root by default; only user-scoped setup (uv's managed
        # Python, uv tools, Claude Code plugin registration, the Codex seed)
        # runs as user "1000" (agent). Every step is idempotent.
        # Hook environments are deny-by-default (only PATH / HOME and the like
        # plus proxy / certificate settings); anything else must be listed in
        # `env`. The built-in claude kit puts claude in ~/.local/bin, so agent
        # hooks prepend it to PATH before calling claude.
        #
        # NOTE: the cwd of an install hook is not necessarily the workspace, so
        # `uv sync` and `prek install` are NOT run here — they are handled by
        # the agent per the agent context below.

        # The v3 claude image (Docker Hardened Images, Debian) ships a Debian
        # `uv` package at /usr/bin/uv that aborts on the VM's 16K memory pages
        # (`<jemalloc>: Unsupported system page size`). The official astral
        # build handles 16K pages, so install it into /usr/local/bin — ahead
        # of /usr/bin on the agent's PATH — whenever the uv found on PATH
        # cannot run.
        - description: uv (official build; skipped when a working uv exists)
          command: |
            set -eu
            if uv --version >/dev/null 2>&1; then
              uv --version
            else
              curl -LsSf https://astral.sh/uv/install.sh \
                | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
              # Absolute path: root hooks may search /usr/bin first.
              /usr/local/bin/uv --version
            fi

        # Pre-fetch the interpreter so the first `uv sync` is fast and still
        # works if the network policy is tightened later. Keep in sync with
        # .python-version and `requires-python` in pyproject.toml.
        - description: Python 3.14 toolchain (matches .python-version)
          user: "1000"
          command: |
            set -eu
            uv python install 3.14

        # Same pre-commit hook runner the Dev Container uses
        # (.devcontainer/post-create.sh). Registering the git hook needs the
        # workspace as cwd, so `prek install` is left to the agent.
        - description: prek (pre-commit hook runner)
          user: "1000"
          command: |
            set -eu
            uv tool install prek

        # This project itself needs no Node — it is only the Codex CLI's
        # runtime. Skipped when the image already ships npm.
        - description: Node 24 for the Codex CLI (skipped when npm exists)
          command: |
            set -eu
            if ! command -v npm >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
              apt-get install -y --no-install-recommends nodejs
            fi

        # Version pinned for reproducibility and supply-chain hygiene (the
        # Dev Container installs it unpinned; bump both together).
        - description: Codex CLI (skipped when the image already ships it)
          command: |
            set -eu
            command -v codex >/dev/null 2>&1 || npm install -g @openai/codex@0.149.1

        # Register Codex as a Claude Code plugin so Claude Code can delegate to
        # Codex on demand (the codex-rescue subagent + /codex skills). Mirrors
        # .devcontainer/post-create.sh. Skipped in sandboxes without claude,
        # and skipped when already installed, so the step stays idempotent.
        # Marketplace installs cannot pin a version, so this one always takes
        # the latest.
        - description: Codex plugin for Claude Code (claude sandboxes only)
          user: "1000"
          command: |
            set -eu
            export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"
            command -v claude >/dev/null 2>&1 || exit 0
            if ! claude plugin list 2>/dev/null | grep -q 'codex@openai-codex'; then
              claude plugin marketplace add openai/codex-plugin-cc || true
              claude plugin install codex@openai-codex
            fi

        # Initial Codex CLI config. Not overwritten if the codex kit already
        # seeded one. A hook rather than `lifecycle.files` because it embeds
        # the workspace's absolute path: the built-in claude kit has no
        # WORKSPACE_DIR in its final environment, so `${{ kit.env.WORKSPACE_DIR }}`
        # in `files` fails to expand there, while a hook receives it through
        # `env` (in clone mode it mirrors the host's absolute path). Without a
        # workspace the trust entry is left out.
        # Kept aligned with .devcontainer/codex-config.toml except for the
        # approval policy — see the closing paragraph of the runbook's
        # "Overriding the built-in YOLO launch commands".
        - description: Codex CLI config seed (skipped when one exists; agent user)
          user: "1000"
          env: [WORKSPACE_DIR]
          command: |
            set -eu
            CFG="$HOME/.codex/config.toml"
            [ -e "$CFG" ] && exit 0
            mkdir -p "$HOME/.codex"
            cat > "$CFG" <<'EOF'
            #:schema https://developers.openai.com/codex/config-schema.json

            # The sandbox (microVM) is itself the isolation boundary for
            # autonomous agent runs. Keep writes scoped to the workspace, but
            # route escalated approval requests to an automatic review rather
            # than to a human (equivalent to the CLI's `--approve-for-me`).
            # Unlike `approval_policy = "never"`, which never asks at all,
            # deviations such as writing outside the sandbox or cutting the
            # network still go through a risk assessment first.
            approval_policy = "on-request"
            approvals_reviewer = "auto_review"
            sandbox_mode = "workspace-write"
            project_doc_max_bytes = 65536

            [sandbox_workspace_write]
            network_access = true
            EOF
            if [ -n "${WORKSPACE_DIR:-}" ]; then
              printf '\n[projects."%s"]\ntrust_level = "trusted"\n' "$WORKSPACE_DIR" >> "$CFG"
            fi

  # --- Agent context ---------------------------------------------------------------
  # The discovery profile (where CLAUDE.md / AGENTS.md live) belongs to the
  # workload kit, so the mixin contributes the body only.
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        - This environment is a Docker Sandboxes microVM. The workspace is an
          independent git clone (clone mode), not the host's working tree. Edits
          do NOT sync back to the host — always commit and push your results
          (removing the sandbox discards any commit you did not push).
        - To pick up commits the host added after the sandbox was created, fetch
          from `/run/sandbox/source`, a read-only bind mount of the host
          repository (`git fetch /run/sandbox/source`). `origin` points at
          GitHub and does not contain the host's unpushed commits.
        - Gitignored files (local settings and the like) are not part of the clone.
        - The host's git identity is not carried over. If a commit fails because
          `user.name` / `user.email` are unset, ask the user for them instead of
          inventing an identity.
        - Python tooling is uv. Start with `uv sync --frozen`; run tasks as
          `uv run task lint` / `uv run task test` / `uv run task test_cov`.
        - Before committing, register the pre-commit hooks once with
          `prek install` (installed with `uv tool install`, in ~/.local/bin).
        - Do not use `pkill -f <pattern>` to stop background processes: the
          whole command line matches, so your own shell matches too and gets
          killed. Kill by PID instead — `PID=$(pgrep -f '<pattern>' | head -1); kill "$PID"`.
        - GitHub authentication is injected as a header by the host-side proxy.
          The GH_TOKEN environment variable holds a sentinel, not the real
          value, and the real token does not exist in this environment. There
          is never any reason to read, search for, or print it.
        - pass-cli / pass-relogin do NOT exist here (they are Dev Container-only).
          AGENTS.md describes them because it also covers the Dev Container;
          ignore those instructions in this environment.
        - Outbound traffic is a deny-by-default domain allowlist. A denied
          request gets a 403 whose body reads `Approval required for <host>:<port>.`
          If you need a destination outside the allowlist, ask the user instead
          of working around it.
