name: Verify Actions Lockfile

# Fails when .github/workflows/actions.lock is out of sync with the workflows
# or a locked pin no longer verifies upstream.
# cf. https://docs.github.com/en/actions/how-tos/secure-your-work/lock-workflow-dependencies
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        # Pinned for reproducible runs; Dependabot does not track gh extensions, so bump manually
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
