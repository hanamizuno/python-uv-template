name: Generate SBOM

on:
  push:
    branches: [main]
    paths:
      - "uv.lock"
      - "pyproject.toml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install the project
        # --locked also fails when uv.lock is out of sync with pyproject.toml
        run: uv sync --locked

      - name: Generate SBOM (CycloneDX)
        # cyclonedx-py is provided by the cyclonedx-bom package; pin for reproducible runs
        run: uvx --from cyclonedx-bom==7.3.0 cyclonedx-py environment -o sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
