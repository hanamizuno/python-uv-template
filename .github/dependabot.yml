version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
